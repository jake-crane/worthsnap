spring.application.name=worthsnap-service

# Cloud Run (and most hosts) inject their own PORT env var and expect the app to listen on it.
server.port=${PORT:8081}

# DATABASE_URL must be a JDBC url (jdbc:postgresql://...), not the postgres:// form Neon gives
# you - strip the embedded user:password from Neon's connection string into the two properties
# below, and keep its ?sslmode=require on the URL.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/worthsnap}
spring.datasource.username=${DATABASE_USERNAME:worthsnap}
spring.datasource.password=${DATABASE_PASSWORD:worthsnap}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Local, untracked file for real OAuth secrets (see backend/secrets.properties.example).
# Optional so the app still starts fine without it, using the "unset" placeholders below.
spring.config.import=optional:file:./secrets.properties

# Origin the browser actually uses (must match, since OAuth redirect URIs are origin-specific).
# In dev this is the Vite dev server, which proxies /oauth2, /login, and /logout to this backend.
app.base-url=${APP_BASE_URL:http://localhost:5173}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${app.base-url}/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:unset}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${app.base-url}/login/oauth2/code/github
